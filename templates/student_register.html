
<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="form-card">

    <h1>Student Registration</h1>


    <form method="POST">


        <!-- Full Name -->

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <!-- Student ID -->

        <label>Student ID</label>

        <input
            type="text"
            name="student_id"
            placeholder="Enter your student ID"
            required
        >


        <!-- Email -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <!-- Password -->

        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('password', this)"
            >
                Show
            </button>

        </div>


        <!-- Password Requirements -->

        <div class="password-requirements">

            <strong>Password must contain:</strong>

            <p id="length">○ At least 8 characters</p>

            <p id="uppercase">○ One uppercase letter</p>

            <p id="lowercase">○ One lowercase letter</p>

            <p id="number">○ One number</p>

            <p id="special">○ One special character</p>

        </div>


        <!-- Confirm Password -->

        <label>Confirm Password</label>

        <div class="password-box">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('confirm_password', this)"
            >
                Show
            </button>

        </div>


        <!-- Password Match Message -->

        <p id="match"></p>


        <!-- Submit -->

        <button type="submit">
            Create Account
        </button>


    </form>


    <!-- Login Link -->

    <p style="margin-top: 20px; text-align: center; color: #64748b;">

        Already have an account?

        <a href="/student-login" style="color: #2563eb;">
            Login here
        </a>

    </p>


    <!-- Home Link -->

    <p style="text-align: center; margin-top: 15px;">

        <a href="/" style="color: #64748b;">
            ← Back to Home
        </a>

    </p>


</div>



<script>


/* =========================
   SHOW / HIDE PASSWORD
   ========================= */

function togglePassword(fieldId, button) {

    const field = document.getElementById(fieldId);


    if (field.type === "password") {

        field.type = "text";

        button.textContent = "Hide";

    } else {

        field.type = "password";

        button.textContent = "Show";

    }

}



/* =========================
   PASSWORD VALIDATION
   ========================= */

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirm_password");



password.addEventListener("input", checkPassword);

confirmPassword.addEventListener("input", checkPassword);



function checkPassword() {

    const value = password.value;


    /* 8 Characters */

    const length =
        document.getElementById("length");


    if (value.length >= 8) {

        length.textContent =
            "✓ At least 8 characters";

        length.style.color = "#16a34a";

    } else {

        length.textContent =
            "○ At least 8 characters";

        length.style.color = "#64748b";

    }



    /* Uppercase */

    const uppercase =
        document.getElementById("uppercase");


    if (/[A-Z]/.test(value)) {

        uppercase.textContent =
            "✓ One uppercase letter";

        uppercase.style.color = "#16a34a";

    } else {

        uppercase.textContent =
            "○ One uppercase letter";

        uppercase.style.color = "#64748b";

    }



    /* Lowercase */

    const lowercase =
        document.getElementById("lowercase");


    if (/[a-z]/.test(value)) {

        lowercase.textContent =
            "✓ One lowercase letter";

        lowercase.style.color = "#16a34a";

    } else {

        lowercase.textContent =
            "○ One lowercase letter";

        lowercase.style.color = "#64748b";

    }



    /* Number */

    const number =
        document.getElementById("number");


    if (/[0-9]/.test(value)) {

        number.textContent =
            "✓ One number";

        number.style.color = "#16a34a";

    } else {

        number.textContent =
            "○ One number";

        number.style.color = "#64748b";

    }



    /* Special Character */

    const special =
        document.getElementById("special");


    if (/[^A-Za-z0-9]/.test(value)) {

        special.textContent =
            "✓ One special character";

        special.style.color = "#16a34a";

    } else {

        special.textContent =
            "○ One special character";

        special.style.color = "#64748b";

    }



    /* Confirm Password */

    checkMatch();

}



/* =========================
   CONFIRM PASSWORD
   ========================= */

function checkMatch() {

    const match =
        document.getElementById("match");


    if (confirmPassword.value === "") {

        match.textContent = "";

    }

    else if (
        password.value === confirmPassword.value
    ) {

        match.textContent =
            "✓ Passwords match";

        match.style.color = "#16a34a";

    }

    else {

        match.textContent =
            "✗ Passwords do not match";

        match.style.color = "#dc2626";

    }

}


</script>
<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>

</html>
