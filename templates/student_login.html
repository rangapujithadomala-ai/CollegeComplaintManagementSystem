
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-theme-controls {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
        }

        .appearance-button {
            padding: 12px 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: white;
            color: #17365d;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .appearance-button:hover {
            background: #e8effa;
        }

        .appearance-popup {
            display: none;
            position: absolute;
            right: 0;
            bottom: 60px;
            width: 220px;
            padding: 18px;
            background: white;
            color: #25344a;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .appearance-popup.show {
            display: block;
        }

        .appearance-popup h3 {
            margin-bottom: 12px;
        }

        .appearance-popup button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .forgot-password {
            display: block;
            margin-top: 12px;
            text-align: right;
            font-size: 14px;
            color: #2563eb;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Password field and show/hide button */
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 0;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            line-height: 1;
        }

        .password-toggle:hover {
            color: #2563eb;
        }

        .password-toggle:focus-visible {
            outline: 2px solid #2563eb;
            border-radius: 4px;
        }

        body.dark {
            background: #111827 !important;
            color: #f3f4f6 !important;
        }

        body.dark .form-card {
            background: #1f2937 !important;
            color: #f3f4f6 !important;
            border-color: #374151 !important;
        }

        body.dark .form-card h1,
        body.dark .form-card label {
            color: #f3f4f6 !important;
        }

        body.dark .form-card p {
            color: #d1d5db !important;
        }

        body.dark .form-card a {
            color: #93c5fd !important;
        }

        body.dark .form-card input {
            background: #111827;
            color: #f3f4f6;
            border-color: #4b5563;
        }

        body.dark .password-toggle {
            color: #d1d5db;
        }

        body.dark .appearance-button {
            background: #1f2937;
            color: white;
            border-color: #4b5563;
        }

        body.dark .appearance-popup {
            background: #1f2937;
            color: white;
            border-color: #4b5563;
        }

        @media (max-width: 480px) {
            .login-theme-controls {
                right: 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">
        <h1>Student Login</h1>

        <form method="POST">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="password-toggle"
                    aria-label="Show password"
                    aria-pressed="false"
                    title="Show password">
                    👁
                </button>
            </div>

            <a class="forgot-password"
               href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

            <button type="submit">Login</button>
        </form>

        <p style="margin-top: 20px; text-align: center; color: #64748b;">
            Don't have an account?
            <a href="{{ url_for('student_register') }}"
               style="color: #2563eb;">
                Register here
            </a>
        </p>

        <p style="text-align: center; margin-top: 15px;">
            <a href="/" style="color: #64748b;">← Back to Home</a>
        </p>
    </div>

    <div class="login-theme-controls">
        <div class="appearance-popup" id="appearance-popup">
            <h3>Appearance</h3>
            <button type="button" id="login-theme-toggle">
                Switch to Dark Mode
            </button>
        </div>

        <button
            type="button"
            class="appearance-button"
            id="appearance-button"
            aria-expanded="false">
            ⚙ Appearance
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const passwordInput = document.getElementById("password");
            const passwordToggle = document.getElementById("password-toggle");

            /* Show or hide password */
            passwordToggle.addEventListener("click", function () {
                const isPasswordHidden =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPasswordHidden ? "text" : "password";

                passwordToggle.textContent =
                    isPasswordHidden ? "🙈" : "👁";

                passwordToggle.setAttribute(
                    "aria-label",
                    isPasswordHidden ? "Hide password" : "Show password"
                );

                passwordToggle.setAttribute(
                    "title",
                    isPasswordHidden ? "Hide password" : "Show password"
                );

                passwordToggle.setAttribute(
                    "aria-pressed",
                    String(isPasswordHidden)
                );
            });

            const appearanceButton =
                document.getElementById("appearance-button");

            const appearancePopup =
                document.getElementById("appearance-popup");

            const themeToggle =
                document.getElementById("login-theme-toggle");

            const THEME_KEY = "studentDashboardTheme";

            function applyTheme(theme) {
                document.body.classList.toggle("dark", theme === "dark");
                document.body.classList.toggle("dark-mode", theme === "dark");
                localStorage.setItem(THEME_KEY, theme);
                updateThemeButton();
            }

            function updateThemeButton() {
                themeToggle.textContent =
                    document.body.classList.contains("dark")
                    ? "Switch to Light Mode"
                    : "Switch to Dark Mode";
            }

            const savedTheme = localStorage.getItem(THEME_KEY);

            if (savedTheme === "dark") {
                document.body.classList.add("dark", "dark-mode");
            } else {
                document.body.classList.remove("dark", "dark-mode");
            }

            updateThemeButton();

            appearanceButton.addEventListener("click", function (event) {
                event.stopPropagation();

                const opening =
                    !appearancePopup.classList.contains("show");

                appearancePopup.classList.toggle("show", opening);

                appearanceButton.setAttribute(
                    "aria-expanded", String(opening)
                );
            });

            themeToggle.addEventListener("click", function () {
                const isDark =
                    document.body.classList.contains("dark");

                applyTheme(isDark ? "light" : "dark");
            });

            document.addEventListener("click", function (event) {
                if (
                    !appearancePopup.contains(event.target) &&
                    !appearanceButton.contains(event.target)
                ) {
                    appearancePopup.classList.remove("show");
                    appearanceButton.setAttribute("aria-expanded", "false");
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    appearancePopup.classList.remove("show");
                    appearanceButton.setAttribute("aria-expanded", "false");
                }
            });
        });
    </script>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
