<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reset-card {
            width: 100%;
            max-width: 440px;
            margin: 60px auto;
            padding: 32px;
            background: var(--card-bg, #ffffff);
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
        }
        .reset-card h1 { text-align: center; margin-bottom: 10px; }
        .reset-card p { text-align: center; margin-bottom: 24px; }
        .reset-card label { display: block; margin: 15px 0 7px; }
        .reset-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }
        .reset-card button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .reset-card .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
        body.dark-mode .reset-card {
            background: #1e293b;
            color: #f1f5f9;
        }
        body.dark-mode .reset-card input {
            background: #0f172a;
            color: #f1f5f9;
            border-color: #475569;
        }
    </style>
</head>
<body>
    <div class="form-card reset-card">
        <h1>Reset Password</h1>
        <p>Create a new password for your student account.</p>

        <form method="POST" action="{{ url_for('reset_password') }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter a new password" required>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   placeholder="Re-enter your new password" required>

            <button type="submit">Reset Password</button>
        </form>

        <a class="back-link" href="{{ url_for('student_login') }}">← Back to Login</a>
    </div>

    <script>
        if (localStorage.getItem("studentDashboardTheme") === "dark") {
            document.body.classList.add("dark-mode");
        }
    </script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
